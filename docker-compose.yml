services:
  llm-service:
    build:
      context: ./src/llm-client
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: unless-stopped

  cache-service:
    build:
      context: ./src/cache-system
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - llm-service
    restart: unless-stopped

  traffic-generator:
    build:
      context: ./src/traffic-generator
      dockerfile: Dockerfile
    depends_on:
      - cache-service
    restart: unless-stopped
    volumes:
      - ./datasets:/app/datasets