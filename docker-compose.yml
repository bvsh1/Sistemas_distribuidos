services:
  llm-service:
    build:
      context: ./src/llm-client  # 📌 Contexto SOLO en la carpeta llm-client
      dockerfile: Dockerfile     # 📌 Dockerfile está en el mismo directorio
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  cache-service:
    build:
      context: ./src/cache-system  # 📌 Contexto SOLO en cache-system
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CACHE_POLICY=lru
      - CACHE_SIZE=1000
      - CACHE_TTL=3600
      - LLM_SERVICE_URL=http://llm-service:5000
      - STORAGE_SERVICE_URL=http://storage-service:8080
    depends_on:
      - llm-service
    restart: unless-stopped

  traffic-generator:
    build:
      context: ./src/traffic-generator  # 📌 Contexto SOLO en traffic-generator
      dockerfile: Dockerfile
    depends_on:
      - cache-service
    environment:
      - CACHE_SERVICE_URL=http://cache-service:8000
    restart: unless-stopped
    volumes:
      - ./datasets:/app/datasets

# Red network
networks:
  default:
    name: yahoo-answers-network
    driver: bridge